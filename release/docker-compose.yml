version: '3.8'

services:
  vigil-x:
    image: vigil-x:v1.0.0
    container_name: vigil-x-safety-system
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./config:/app/config:ro
      - ./data/events.jsonl:/app/data/events.jsonl
    # Hardware V4L2 camera passthrough (uncomment when physical camera is plugged in):
    # devices:
    #   - "/dev/video0:/dev/video0"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
